<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Результат поиска слов</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <main class="container">
        <h1>Результат анализа директории {{ name_folder }}</h1>
        {% if report %}
        <pre>{{ report }}</pre>
        {% else %}
        <p>{{ err }}</p>
        {% endif %}
        <button onclick="window.location.href='/directory-analytics/new'">Вернуться к анализу</button>
        
    </main>
</body>
</html>
